<!DOCTYPE html>
<!--
  ============================================================================
  MODÈLE DE MODULE « Réviser le DS » — pour l'onglet Cours de l'Organisateur
  ============================================================================
  Comment l'utiliser
    1. Copie ce fichier et renomme-le (ex. : module-thermique-batiment.html).
    2. Remplace le contenu d'EXEMPLE (une matière fictive « Conduction thermique »)
       par ta matière : en-tête, couleurs, puis le bloc « DONNÉES DE LA MATIÈRE » plus bas.
       Le plus simple : donne ce modèle + tes cours (PDF, photos, TD corrigés, sujets
       de DS) à Claude et demande-lui de le remplir en gardant exactement la structure.
    3. Ouvre le fichier dans un navigateur : un contrôle s'affiche (tout doit être vert).
    4. Dans l'app : onglet Cours → « ⇄ matières » → « Importer un module (.html) ».
       La matière est synchronisée sur ton téléphone et ton PC.

  Ce que l'app construit toute seule à partir de ces données
    - Partie 1 · Cours : une notion par leçon, avec le prof audio et une flashcard
      « explique » (tirée des encadrés À retenir, des formules et des mots en gras).
    - Partie 2 · Méthodes : une méthode par chapitre qui a des exercices corrigés.
    - Partie 3 · Application (aussi dans Réviser → 🧮 Application) : les exos de XAPP, avec de
      NOUVEAUX CHIFFRES à chaque essai, choisis pour se calculer DE TÊTE, et des questions pour
      COMPRENDRE (lire le schéma, choisir la formule, « si on double… »). En plus, les étapes des
      exercices corrigés deviennent des questions.
    - Schémas pas à pas (XSCHEMA) : un schéma SVG commenté étape par étape (ce qui entre, ce qui
      sort, où ça va dans les formules), avec des flèches animées. Il s'affiche dans les leçons du
      cours (lecons), dans les exos d'application (schema) et dans Réviser → Application.
    - « ⚡ Ta 1re action ? » (XTETE) : questions éclair sur la première chose à faire face à un énoncé
      (contrôle de tête). L'app en fabrique aussi à partir des exercices corrigés.
    - Méthodes : « Les variantes possibles » (XVARIANTES) et « Où ça tombe » (calculé tout seul à
      partir des titres « TD n — … » et « DS 2025 — … » des exercices).
    - Partie 4 · Vrai DS : chaque exercice dont le titre commence par « DS 2025 — »
      (ou « DS 2024-25 — ») forme un vrai sujet ; + un DS blanc tiré au hasard.
    - Réviser → DS corrigés : les exercices dont le titre commence par « DS 2025 — », « DS1 — »,
      « Contrôle — »… sont rangés par sujet, dans l'ordre des exercices (Ex.1, Ex.2…), avec leur
      corrigé. Ils restent aussi dans « Exercices corrigés ».
    - Onglet TD : préparer chaque TD la veille (pré-test, l'essentiel, exercice
      corrigé pas à pas, bilan). Les TD d'id « td1 », « td2 »… sont ouverts directement
      depuis l'agenda (« Préparer le TD 2 »).
    - Onglet DS : 3 séances de 30 min (la 3e est un mini DS blanc).

  Règles à respecter
    - Garde les noms des constantes : APP, COURSE, QUESTIONS, FAMILY_LABEL, FORMULAS,
      EXERCICES (obligatoires) et XTD, XESS, XFICHE, XFLASH, XAPP, XSCHEMA, XTETE, XVARIANTES
      (facultatifs). Ce sont des données simples : pas de fonction ni de variable.
    - Les « id » sont courts, sans espace ni accent, et uniques (ex. : "bases", "q1").
    - Le champ « m » d'une question, d'une formule ou d'un exercice = l'id d'un module
      de COURSE.
    - Dans les leçons (h) : HTML simple. Encadrés reconnus : <div class="retenir">,
      <div class="piege">, <div class="tip">, <div class="exemple"> (pas de <div> à
      l'intérieur d'un encadré). Formule en bloc : <div class="blockf">…</div>.
      Les mots en <b>gras</b> deviennent les mots clés de la flashcard.
    - Indices et exposants : <sub>…</sub> et <sup>…</sup> dans COURSE, QUESTIONS,
      FORMULAS et EXERCICES ; écriture courte T^(4), λ_(1) dans XESS, XFICHE, XFLASH.
    - Le TITRE (dans <title> et dans l'en-tête) = le nom de la matière. Pas besoin du nom exact de
      l'emploi du temps : l'app reconnaît les noms proches (« Thermo » ↔ « Thermodynamique »,
      « Régulation » ↔ « Régulation des installations », une faute ou un pluriel près, les mots dans
      le désordre) et le code du module (ex. R3.08) : mets-le dans le sous-titre.
    - MOTS CLÉS (balise <meta name="mots-cles"> juste en dessous) : d'autres noms de la matière,
      séparés par des virgules, surtout s'ils ne ressemblent pas au titre (ex. « clim » pour
      « Traitement de l'air »). Grâce au titre et à ces mots, une révision « Préparer le TD de demain · … »
      ou « DS … · 2/3 Appliquer » ouvre directement cette matière, au bon TD (onglet TD) ou à la
      bonne séance de DS (séance 1, 2 ou 3).
    - LIEN TD ↔ COURS (pour savoir quoi réviser au DS) : dans XTD, dis quels chapitres (mods) ou quelles
      notions (notions) chaque TD utilise, et titre les exercices « TD n — Exercice k : … ». Avec ton
      avancement des TD, l'onglet DS affiche alors « 🎯 Quoi réviser pour le DS » : les notions à revoir
      en priorité (liées à tes exos à revoir ou importants ⭐), les chapitres du DS, et ceux qui ne sont
      pas utiles pour ce DS (pas encore vus en TD).
    - APPLICATION (XAPP) : Daniel fait la plupart des calculs DE TÊTE. Les valeurs tirées doivent donc
      être rondes (listes de valeurs faciles) et le résultat simple (utilise « si » pour l'exiger,
      ex. si: "entier(phi)"). Niveau 1 = comprendre (choix), niveau 2 = calculer de tête, niveau 3 =
      comme au DS + une question de raisonnement. Le contrôle en bas de page tire des exemples.
    - SCHÉMAS (XSCHEMA) : dessine en SVG (viewBox d'environ 360 de large), mets data-k="nom" sur
      chaque élément ou groupe à montrer, puis décris les étapes : { t: "texte", on: ["nom", …],
      f: "formule (facultatif)" }. Classes prêtes : bx (bloc), ln (trait), anim (flèche animée),
      trace (courbe qui se dessine, avec pathLength="100"), dsh (pointillés), ax (axe), pt (point),
      ac / wa / gr (couleur accent / rouge / vert), tb (texte gras), ts (petit texte gris).
      Pointe de flèche : marker-end="url(#xsfl)". Formules en texte simple (Φ = λ·S·ΔT / e).
-->

<body>
<header>
  <div class="hd-in">
    <!-- Logo : un petit dessin SVG de 100 × 100 (garde class="logo-sign") -->

<script>
/* ============================================================================
   DONNÉES DE LA MATIÈRE — c'est la seule partie à remplir
   ============================================================================ */

/* Réglages des examens blancs (onglet Réviser) */
const APP = {
  storageKey: "revision-conduction-v1",   // nom unique pour la sauvegarde
  examQuestionsPerModule: 3,              // questions par module dans l'examen blanc
  examMinutes: 25,                        // durée de l'examen blanc
  moduleQuizSize: 6,                      // QCM d'un module
  mixQuizSize: 12                         // QCM mélangé
};

/* LE COURS : des modules (chapitres), chacun avec ses leçons (= notions).
   Garde l'ordre du cours : l'app suit cet ordre (du plus simple au plus complexe). */
const COURSE = [
  {
    id: "bases",                     // id court du module
    num: 1,
    title: "Les bases de la conduction",
    desc: "Loi de Fourier, flux, résistance thermique d’une paroi plane.",
    lessons: [
      {
        id: "fourier",
        t: "La loi de Fourier",
        h: `
  <p>La <b>conduction</b> est le transfert de chaleur dans la matière, sans déplacement de matière : du plus chaud vers le plus froid.</p>
  <p>Pour une paroi plane d’épaisseur e, de surface S, dont les faces sont à T<sub>1</sub> et T<sub>2</sub> :</p>
  <div class="blockf">Φ = λ · S · (T<sub>1</sub> − T<sub>2</sub>) / e</div>
  <ul>
    <li>Φ : <b>flux thermique</b> en W</li>
    <li>λ : <b>conductivité thermique</b> en W/(m·K) (béton ≈ 1,75 ; laine minérale ≈ 0,04)</li>
    <li>e en m, S en m², T en °C ou K (seule la différence compte)</li>
  </ul>
  <div class="retenir"><b>À retenir.</b> Plus λ est petit, plus le matériau est isolant ; doubler l’épaisseur divise le flux par deux.</div>
  <div class="piege"><b>Piège.</b> L’épaisseur se met en mètres : 20 cm = 0,20 m, pas 20.</div>`
      },
      {
        id: "resistance",
        t: "La résistance thermique",
        h: `
  <p>On écrit la loi de Fourier comme une loi d’Ohm : l’écart de température « pousse » le flux à travers une <b>résistance thermique</b>.</p>
  <div class="blockf">R = e / (λ · S) &nbsp;[K/W] &nbsp;&nbsp;·&nbsp;&nbsp; Φ = (T<sub>1</sub> − T<sub>2</sub>) / R</div>
  <div class="tip"><b>Astuce.</b> Analogie électrique : ΔT ↔ tension, Φ ↔ courant, R ↔ résistance.</div>
  <div class="retenir"><b>À retenir.</b> Des couches traversées l’une après l’autre sont <b>en série</b> : leurs résistances s’additionnent.</div>`
      }
    ]
  },
  {
    id: "parois",
    num: 2,
    title: "Parois composées et convection",
    desc: "Murs multicouches, échanges avec l’air, coefficient U.",
    lessons: [
      {
        id: "multicouche",
        t: "La paroi multicouche",
        h: `
  <p>Pour un mur fait de plusieurs couches, on additionne les résistances de chaque couche.</p>
  <div class="blockf">R<sub>tot</sub> = Σ e<sub>i</sub> / (λ<sub>i</sub> · S)</div>
  <div class="exemple"><b>Exemple.</b> 20 cm de béton (λ = 1,75) + 10 cm d’isolant (λ = 0,04), pour 1 m² : R = 0,114 + 2,5 = 2,61 K/W. C’est l’isolant qui fait presque tout.</div>`
      },
      {
        id: "convection",
        t: "Convection et coefficient U",
        h: `
  <p>À la surface du mur, l’air échange de la chaleur par <b>convection</b> : Φ = h · S · (T<sub>surface</sub> − T<sub>air</sub>).</p>
  <div class="blockf">R<sub>conv</sub> = 1 / (h · S)</div>
  <p>Le <b>coefficient de transmission U</b> regroupe tout, pour 1 m² de paroi :</p>
  <div class="blockf">1/U = 1/h<sub>i</sub> + Σ e<sub>i</sub>/λ<sub>i</sub> + 1/h<sub>e</sub> &nbsp;&nbsp;·&nbsp;&nbsp; Φ = U · S · ΔT</div>
  <div class="retenir"><b>À retenir.</b> U s’exprime en W/(m²·K) : plus il est petit, mieux la paroi isole.</div>
  <div class="piege"><b>Piège.</b> Ne pas oublier les deux résistances superficielles 1/h<sub>i</sub> et 1/h<sub>e</sub>.</div>`
      }
    ]
  }
];

/* Nom court de chaque module (même ids que COURSE) */
const FAMILY_LABEL = {
  bases: "Bases de la conduction",
  parois: "Parois composées"
};

/* QCM : q = question, c = propositions, a = numéro de la bonne réponse (0 = la 1re),
   e = explication affichée après la réponse, m = id du module. Vise 6 à 10 par module. */
const QUESTIONS = [
  { id: "q1", m: "bases", q: "Unité de la conductivité thermique λ :", c: ["W/(m·K)", "W/(m²·K)", "K/W", "J/kg/K"], a: 0, e: "λ en W/(m·K) ; U en W/(m²·K)." },
  { id: "q2", m: "bases", q: "On double l’épaisseur d’une paroi : le flux…", c: ["double", "est divisé par 2", "ne change pas", "est divisé par 4"], a: 1, e: "Φ = λ·S·ΔT/e : e au dénominateur." },
  { id: "q3", m: "bases", q: "Résistance thermique d’une paroi plane :", c: ["R = λ·S/e", "R = e/(λ·S)", "R = e·λ/S", "R = 1/(h·S)"], a: 1, e: "R = e/(λ·S), en K/W." },
  { id: "q4", m: "bases", q: "Deux couches traversées l’une après l’autre :", c: ["résistances en parallèle", "résistances en série (on additionne)", "on multiplie les λ", "on garde la plus grande"], a: 1, e: "Le flux traverse les deux : c’est un montage en série." },
  { id: "q5", m: "parois", q: "Résistance de convection d’une surface S :", c: ["h·S", "1/(h·S)", "h/S", "S/h"], a: 1, e: "Φ = h·S·ΔT donc R = 1/(h·S)." },
  { id: "q6", m: "parois", q: "Une paroi a U = 0,36 W/(m²·K). Pour 10 m² et ΔT = 20 K :", c: ["7,2 W", "36 W", "72 W", "720 W"], a: 2, e: "Φ = U·S·ΔT = 0,36 × 10 × 20 = 72 W." },
  { id: "q7", m: "parois", q: "Dans un mur béton + isolant, la plus grande résistance vient :", c: ["du béton", "de l’isolant", "de l’air intérieur", "elles sont égales"], a: 1, e: "e/λ = 0,10/0,04 = 2,5 contre 0,20/1,75 = 0,11 pour le béton." },
  { id: "q8", m: "parois", q: "Unité du coefficient de transmission U :", c: ["W/(m·K)", "W/(m²·K)", "K/W", "m²·K/W"], a: 1, e: "U est un flux par m² et par kelvin d’écart : W/(m²·K)." },
  { id: "q9", m: "bases", q: "La conduction transfère la chaleur :", c: ["par déplacement d’air", "par rayonnement", "dans la matière, sans déplacement de matière", "seulement dans les métaux"], a: 2, e: "C’est la définition de la conduction ; l’air qui bouge, c’est la convection." }
];

/* Formules (flashcards et fiche de dernière minute). n = nom, f = formule, d = détail. */
const FORMULAS = [
  { id: "f1", m: "bases", n: "Loi de Fourier (paroi plane)", f: "Φ = λ · S · (T<sub>1</sub> − T<sub>2</sub>) / e", d: "Φ en W, λ en W/(m·K), e en m." },
  { id: "f2", m: "bases", n: "Résistance de conduction", f: "R = e / (λ · S)", d: "En K/W. Φ = ΔT / R." },
  { id: "f3", m: "parois", n: "Résistance de convection", f: "R = 1 / (h · S)", d: "h en W/(m²·K)." },
  { id: "f4", m: "parois", n: "Coefficient U", f: "1/U = 1/h<sub>i</sub> + Σ e<sub>i</sub>/λ<sub>i</sub> + 1/h<sub>e</sub>", d: "Pour 1 m². Φ = U · S · ΔT." }
];

/* EXERCICES CORRIGÉS (TD, DS) : le cœur des parties 2, 3 et 4.
   - titre : commence par « TD 1 — », « TD 2 — »… ou « DS 2025 — Ex.1 : … » pour un vrai sujet de DS.
   - etapes : une étape = une question ou un calcul. methode = comment faire,
     calc = les lignes de calcul, resultat = le résultat (UN seul nombre avec son unité
     si possible : l'app en fait une question à réponse chiffrée). */
const EXERCICES = [
  {
    id: "td1-mur", m: "bases", num: 1,
    titre: "TD 1 — Flux à travers un mur en béton",
    enonce: "Un mur en béton sépare une pièce à 20 °C de l’extérieur à 5 °C (températures des faces). Calculer sa résistance thermique puis le flux qui le traverse.",
    donnees: "e = 0,20 m ; λ = 1,75 W/(m·K) ; S = 10 m².",
    etapes: [
      { titre: "Calculer la résistance thermique du mur", methode: "R = e/(λ·S), avec e en mètres.",
        calc: ["R = 0,20 / (1,75 × 10)", "R = 0,0114 K/W"], resultat: "R ≈ 0,0114 K/W" },
      { titre: "Calculer le flux traversant le mur", methode: "Φ = ΔT / R avec ΔT = T<sub>1</sub> − T<sub>2</sub>.",
        calc: ["ΔT = 20 − 5 = 15 K", "Φ = 15 / 0,01143"], resultat: "Φ ≈ 1312 W" }
    ],
    conclusion: "Un mur en béton seul laisse passer environ 1,3 kW : il faut l’isoler."
  },
  {
    id: "td2-double", m: "parois", num: 2,
    titre: "TD 2 — Paroi béton + isolant",
    enonce: "On ajoute 10 cm d’isolant sur le mur du TD 1. Calculer la nouvelle résistance et le nouveau flux.",
    donnees: "Béton : e = 0,20 m, λ = 1,75 W/(m·K). Isolant : e = 0,10 m, λ = 0,04 W/(m·K). S = 10 m² ; ΔT = 15 K.",
    etapes: [
      { titre: "Résistance de l’isolant", methode: "R = e/(λ·S).", calc: ["R<sub>iso</sub> = 0,10 / (0,04 × 10)"], resultat: "R<sub>iso</sub> = 0,25 K/W" },
      { titre: "Résistance totale (en série)", methode: "On additionne les résistances des couches.", calc: ["R<sub>tot</sub> = 0,0114 + 0,25"], resultat: "R<sub>tot</sub> ≈ 0,261 K/W" },
      { titre: "Nouveau flux", methode: "Φ = ΔT / R<sub>tot</sub>.", calc: ["Φ = 15 / 0,2614"], resultat: "Φ ≈ 57 W" }
    ],
    conclusion: "Le flux passe de 1312 W à 57 W : l’isolant divise les pertes par plus de 20."
  },
  {
    id: "ds25-1", m: "parois", num: 3,
    titre: "DS 2025 — Ex.1 : coefficient U d’un mur isolé",
    enonce: "Mur : 20 cm de béton + 10 cm d’isolant. Intérieur 20 °C, extérieur 0 °C. Calculer la résistance totale pour 1 m², le coefficient U, puis la densité de flux.",
    donnees: "λ<sub>béton</sub> = 1,75 ; λ<sub>iso</sub> = 0,04 W/(m·K) ; h<sub>i</sub> = 8 ; h<sub>e</sub> = 25 W/(m²·K).",
    etapes: [
      { titre: "Q1 — Résistance totale pour 1 m²", methode: "1/h<sub>i</sub> + e<sub>1</sub>/λ<sub>1</sub> + e<sub>2</sub>/λ<sub>2</sub> + 1/h<sub>e</sub>.",
        calc: ["R = 1/8 + 0,20/1,75 + 0,10/0,04 + 1/25", "R = 0,125 + 0,114 + 2,5 + 0,04"], resultat: "R ≈ 2,78 m²·K/W" },
      { titre: "Q2 — Coefficient U", methode: "U = 1/R.", calc: ["U = 1 / 2,779"], resultat: "U ≈ 0,36 W/(m²·K)" },
      { titre: "Q3 — Densité de flux", methode: "φ = U · ΔT.", calc: ["φ = 0,36 × (20 − 0)"], resultat: "φ ≈ 7,2 W/m²" }
    ],
    conclusion: "U ≈ 0,36 W/(m²·K) : la paroi perd environ 7 W par m² pour 20 °C d’écart."
  }
];

/* ---------------------------------------------------------------------------
   FACULTATIF — si tu les enlèves, l'app les fabrique toute seule
   --------------------------------------------------------------------------- */

/* Préparation des TD (onglet TD) et LIEN TD ↔ COURS.
   - id "td1", "td2"… et titre « TD 1 — … » = le n° du TD en classe : l'agenda ouvre le bon TD.
   - mod  = le chapitre principal du TD (id d'un module de COURSE).
   - mods = (facultatif) TOUS les chapitres utilisés par le TD, s'il y en a plusieurs.
   - notions = (facultatif, plus précis) les ids des notions utilisées par le TD.
     → C'est ce lien qui permet à l'app de dire, pour le DS, quels cours revoir et lesquels laisser.
   - pre = ids de 3 questions de pré-test, ess = clé dans XESS, ex = id de l'exercice corrigé. */
const XTD = [
  { id: "td1", title: "TD 1 — Loi de Fourier et résistance", mod: "bases", notions: ["fourier", "resistance"], pre: ["q1", "q2", "q3"], ess: "bases", abq: [], ex: "td1-mur" },
  { id: "td2", title: "TD 2 — Parois composées", mod: "parois", mods: ["bases", "parois"], pre: ["q4", "q5", "q7"], ess: "parois", abq: [], ex: "td2-double" }
];

/* « L'essentiel en 5 lignes » de chaque TD (+ une image pour s'en souvenir). */
const XESS = {
