const Prof={items:[],i:0,tok:0,playing:false,paused:false,timer:null,wait:null,scope:null,fails:0,cur:null,
  voices(){try{return(speechSynthesis.getVoices()||[]).filter(v=>/^fr/i.test(v.lang));}catch(e){return[];}},
  voice(){const vs=this.voices();if(PS.voice){const v=vs.find(x=>x.voiceURI===PS.voice);if(v)return v;}
    const pref=[/Am[eé]lie/i,/Thomas/i,/Audrey/i,/Marie/i,/Google fran/i,/Microsoft (Denise|Henri|Vivienne)/i];for(const r of pref){const v=vs.find(x=>r.test(x.name)&&/fr-FR/i.test(x.lang))||vs.find(x=>r.test(x.name));if(v)return v;}
    return vs.find(v=>/fr-FR/i.test(v.lang))||vs[0]||null;},
  parse(script){let s=String(script||'');s=PS.niveau==='essentiel'?s.replace(/\[\[[\s\S]*?\]\]/g,''):s.replace(/\[\[|\]\]/g,'');
    /* Des phrases entières, regroupées en blocs d'environ 180 caractères : une seule voix continue, sans coupure au milieu des phrases.
       Les mots clés (*mot*) ne changent plus la voix : ils sont en gras dans les sous-titres. */
    const toks=s.split(/(\[hl:[^\]]*\]|\[\?\d*\])/);const items=[];
    const flush=txt=>{txt=txt.replace(/\|\|?/g,' ');
      const sents=txt.replace(/([.!?…])\s+/g,'$1\u0001').split('\u0001').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
      let buf=[],len=0;const out=()=>{if(!buf.length)return;const raw=buf.join(' ');items.push({k:'say',t:raw.replace(/\*+/g,''),cap:md(esc(raw))});buf=[];len=0;};
      sents.forEach(se=>{const l=se.replace(/\*+/g,'').length;if(buf.length&&len+l>180)out();buf.push(se);len+=l+1;});out();};
    toks.forEach((tk,ix)=>{if(!tk)return;if(ix%2){if(tk.startsWith('[hl:'))items.push({k:'hl',id:tk.slice(4,-1)});else{const n=parseInt(tk.slice(2,-1));items.push({k:'wait',s:isNaN(n)?null:n});}}else flush(tk);});
    return items;},
  start(script,who,scope){this.stop();if(!('speechSynthesis' in window)){toast('La synthèse vocale n’est pas disponible sur cet appareil.');return;}
    this.items=this.parse(script);this.i=0;this.playing=true;this.paused=false;this.fails=0;this.scope=scope||$('#app');$('#prof').hidden=false;$('#profWho').textContent=who||'Le prof';this.ui();this.step();},
  ui(){$('#profPlay').innerHTML=this.playing&&!this.paused?ICON.pause:ICON.play;$('#profPlay').setAttribute('aria-label',this.playing&&!this.paused?'Pause':'Lecture');$('#profRate').textContent=String(PS.rate).replace('.',',')+'×';
    const says=this.items.filter(x=>x.k==='say');const done=this.items.slice(0,this.i).filter(x=>x.k==='say').length;$('#profPos').textContent=says.length?Math.min(done+1,says.length)+'/'+says.length:'';},
  caption(html){$('#profCap').innerHTML=html||'';},
  step(){if(!this.playing||this.paused)return;if(this.i>=this.items.length){this.finish();return;}const it=this.items[this.i];
    if(it.k==='hl'){this.hl(it.id);this.i++;return this.step();}
    if(it.k==='wait'){if(!PS.questions){this.i++;return this.step();}let n=it.s||PS.reflexion;const w=$('#profWait');w.hidden=false;$('#profCount').textContent=n;
      this.wait=setInterval(()=>{n--;$('#profCount').textContent=Math.max(n,0);if(n<=0)this.endWait();},1000);return;}
    if(it.k==='say'){this.caption(it.cap);this.ui();const tok=++this.tok;this.speak(it).then(()=>{if(tok!==this.tok||!this.playing||this.paused)return;this.i++;this.step();});}},
  endWait(){clearInterval(this.wait);this.wait=null;$('#profWait').hidden=true;if(this.items[this.i]&&this.items[this.i].k==='wait'){this.i++;this.step();}},
  speak(it){return new Promise(res=>{const u=new SpeechSynthesisUtterance(it.t);this.cur=u;const v=this.voice();if(v){u.voice=v;u.lang=v.lang;}else u.lang='fr-FR';
    const base=PS.style==='dyn'?{r:1.07,p:1.04}:{r:.96,p:1};u.rate=Math.max(.5,Math.min(2,base.r*PS.rate));u.pitch=base.p;
    let done=false;const fin=ok=>{if(done)return;done=true;clearTimeout(g);if(ok)this.fails=0;else{this.fails++;if(this.fails>=3){this.stop();toast('Le son ne fonctionne pas : vérifie le mode silencieux et le volume.');}}res();};
    u.onend=()=>fin(true);u.onerror=e=>fin(e&&(e.error==='interrupted'||e.error==='canceled'));
    const g=setTimeout(()=>fin(true),Math.max(2500,it.t.length*110/u.rate)+4000);
    try{speechSynthesis.speak(u);}catch(e){fin(false);}});},
  hl(id){const sc=this.scope||document;$$('.hlon',sc).forEach(e=>e.classList.remove('hlon'));$$('.hlon-box',sc).forEach(e=>e.classList.remove('hlon-box'));$$('svg.hl-active',sc).forEach(e=>e.classList.remove('hl-active'));
    if(!id)return;const els=$$('[data-hl~="'+CSS.escape(id)+'"]',sc);els.forEach(el=>{if(el instanceof SVGElement&&el.ownerSVGElement){el.classList.add('hlon');el.ownerSVGElement.classList.add('hl-active');}else el.classList.add('hlon-box');});
    const first=els[0];if(first){const tgt=first instanceof SVGElement&&first.ownerSVGElement?first.ownerSVGElement:first;const r=tgt.getBoundingClientRect();const bar=$('#prof').getBoundingClientRect().height||0;
      if(r.top<70||r.bottom>window.innerHeight-bar-10){try{tgt.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){tgt.scrollIntoView();}}}},
  pause(){if(!this.playing)return;if(this.paused){this.paused=false;this.ui();this.step();return;}this.paused=true;this.tok++;try{speechSynthesis.cancel();}catch(e){}this.ui();},
  replay(){if(!this.playing)return;this.tok++;try{speechSynthesis.cancel();}catch(e){}if(this.wait){clearInterval(this.wait);this.wait=null;$('#profWait').hidden=true;}
    let i=Math.min(this.i,this.items.length-1);while(i>0&&!(this.items[i]&&this.items[i].k==='say'))i--;this.i=Math.max(0,i);this.paused=false;this.ui();setTimeout(()=>this.step(),150);},
  finish(){this.playing=false;this.hl(null);this.ui();$('#profCap').innerHTML='<span class="muted">Fin de l’explication.</span>';setTimeout(()=>{if(!this.playing)$('#prof').hidden=true;},1600);},
  stop(){this.playing=false;this.paused=false;this.tok++;clearTimeout(this.timer);if(this.wait){clearInterval(this.wait);this.wait=null;}const w=$('#profWait');if(w)w.hidden=true;try{speechSynthesis.cancel();}catch(e){}this.hl(null);const b=$('#prof');if(b)b.hidden=true;}
};
$('#profPlay').onclick=()=>Prof.pause();$('#profStop').onclick=()=>Prof.stop();$('#profPrev').onclick=()=>Prof.replay();$('#profGo').onclick=()=>Prof.endWait();
$('#profRate').onclick=()=>{const R=[0.8,0.9,1,1.15,1.3,1.5];PS.rate=R[(R.indexOf(PS.rate)+1)%R.length]||1;saveProf();Prof.ui();};
try{speechSynthesis.onvoiceschanged=()=>{if(S.route.v==='settings')render();};}catch(e){}

/* ================= Actions ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,d=el.dataset;const ss=S.session;
  switch(a){
    case 'open':go('subject',{id:d.id});break;
    case 'jour':ouvrirItem(S.jour[+d.i]);break;
    case 'add':go('add');break; case 'settings':go('settings');break;
    case 'next':withPack({id:d.id},pk=>nextStep(pk).go());break;
    case 'subjhome':S.session=null;S.stack=[{v:'home',p:{}}];go('subject',{id:d.id},false);break;
    case 'locked':toast('Termine d’abord le contrôle de la partie précédente (ou active l’accès libre).');break;
    case 'p1':case 'p2':case 'p3':case 'p4':S.session=null;go(a,{id:d.id});break;
    case 'notion':go('notion',{id:d.id,n:d.n});break;
    case 'scrollsect':{const t=$('.sect-card[data-hl="s-'+CSS.escape(d.s)+'"]');if(t)t.scrollIntoView({behavior:'smooth',block:'center'});break;}
    case 'vu':{const pk=S.packs[d.id];const pr=prog(d.id);pr.vus[d.n]=Date.now();saveProg(d.id);const ready=readyNotions(pk);const i=ready.findIndex(n=>n.id===d.n);const nx=ready[i+1];
      if(nx)go('notion',{id:d.id,n:nx.id},false);else{S.session=null;go('flash',{id:d.id},false);}break;}
    case 'say':{const pk=S.packs[d.id];let sc='',who='Le prof';
      if(d.k==='pres'){sc=pk.presentation.audio;who='Le prof · le plan du cours';}
      else if(d.k==='methode'){const m=pk.methodes.find(x=>x.id===d.m);sc=m.audio;who='Le prof · la méthode';}
      else{const n=pk.notions.find(x=>x.id===d.n);sc=n.audio[d.k];who={intro:'Le prof explique',schema:'Visite guidée du schéma',formule:'Lecture de la formule'}[d.k]||'Le prof';}
      Prof.start(sc,who,$('#app'));break;}
    case 'flash':S.session=null;go('flash',{id:d.id});break;
    case 'flip':ss.flip=true;ss.checks={};render();break;
    case 'ptgl':ss.checks[d.k]=!ss.checks[d.k];render();break;
    case 'flashok':{const pk=S.packs[ss.id];const pr=prog(ss.id);const n=pk.notions.find(x=>x.id===ss.queue[0]);const pts=n.flash.points||[];const all=pts.every((_,k)=>ss.checks[k]);
      ss.queue.shift();if(all){ss.done.push(n.id);if(!ss.rappel){pr.flash[n.id]='ok';}else pr.flash[n.id]='ok';saveProg(ss.id);toast('Carte validée');ss.flip=false;ss.checks={};render();}
      else{pr.flash[n.id]='ko';saveProg(ss.id);ss.queue.push(n.id);const missed=pts.filter((_,k)=>!ss.checks[k]);const script='On reprend ce que tu as oublié. || '+missed.map(pt=>pt.prof||pt.t||pt).join(' || ')+' || Cette carte reviendra un peu plus tard.';
        ss.flip=false;ss.checks={};render();Prof.start(script,'Le prof reprend la notion '+n.num,$('#app'));}break;}
    case 'qcm':S.session=null;go('qcm',{id:d.id,kind:d.kind});break;
    case 'osel':if(!ss.shown){ss.sel=+d.o;render();}break;
    case 'qconf':{if(ss.sel==null)return;ss.conf=d.c;ss.shown=true;const q=ss.qs[ss.i];const good=ss.sel===q.a;const counted=good&&ss.conf==='sur';if(counted)ss.score++;ss.ans.push({id:q.id,n:q.n,counted});render();break;}
    case 'qnext':ss.i++;ss.sel=null;ss.conf=null;ss.shown=false;render();window.scrollTo(0,0);break;
    case 'qretry':{const k=ss.qk,id=ss.id;S.session=null;go('qcm',{id,kind:k},false);break;}
    case 'force':{const pr=prog(d.id);if(d.k==='cours')pr.coursForce=true;if(d.k==='tete')pr.teteForce=true;if(d.k==='melange')pr.melangeForce=true;saveProg(d.id);S.session=null;toast('Partie suivante ouverte. Tes points faibles restent dans le rappel.');S.stack=[{v:'home',p:{}}];go('subject',{id:d.id},false);break;}
    case 'methode':go('methode',{id:d.id,m:d.m});break;
    case 'mstep':ss.shown++;render();setTimeout(()=>{const st=$$('.step');const l=st[st.length-1];if(l)l.scrollIntoView({behavior:'smooth',block:'center'});},60);break;
    case 'mall':ss.shown=999;render();break;
    case 'app':S.session=null;go('app',{id:d.id,c:d.c,l:+d.l},S.route.v!=='app');break;
    case 'apick':if(!ss.checked){ss.vals[d.k]=+d.o;delete(ss.err||{})[d.k];render();}break;
    case 'acheck':{if(!checkParts(ss)){render();return;}const pk=S.packs[S.route.p.id];const pr=prog(pk.id);const c=ss.ex.cid,l=ss.ex.level;const ok=ss.ex.parts.every((_,k)=>ss.res[k]);
      pr.app[c]=pr.app[c]||{};if(ok){pr.app[c]['l'+l]=(pr.app[c]['l'+l]||0)+1;}saveProg(pk.id);render();break;}
    case 'anew':ss.seed=(ss.seed*1103515245+12345)>>>0;ss.vals={};ss.res={};ss.err={};ss.checked=false;render();window.scrollTo(0,0);break;
    case 'melange':S.session=null;go('melange',{id:d.id},S.route.v!=='melange');break;
    case 'mtype':if(ss.step==='type'){ss.typeSel=d.m;render();}break;
    case 'mtypeok':{const it=ss.items[ss.i];const c=S.packs[ss.id].application.find(x=>x.id===it.cid);ss.max++;if(ss.typeSel===c.methode){ss.score++;toast('Bon type d’exo');}else toast('Ce n’était pas ce type. Regarde la bonne réponse en vert.');ss.step='solve';ss.vals={};ss.res={};ss.checked=false;render();break;}
    case 'mcheck':{if(!checkParts(ss)){render();return;}ss.ex.parts.forEach((_,k)=>{ss.max++;if(ss.res[k])ss.score++;});render();break;}
    case 'mnext':ss.i++;ss.step='type';ss.typeSel=null;ss.vals={};ss.res={};ss.checked=false;render();window.scrollTo(0,0);break;
    case 'dsstart':S.session=null;go('ds',{id:d.id,d:d.d},S.route.v!=='ds');setTimeout(dsTimer,50);break;
    case 'dsend':ss.phase='corr';render();window.scrollTo(0,0);break;
    case 'dsmark':ss.marks[d.k]=d.v;render();break;
    case 'rappel':S.session=null;go('flash',{id:d.id,rappel:1});break;
    case 'libre':{const pr=prog(d.id);pr.libre=!pr.libre;saveProg(d.id);render();break;}
    case 'pset':{let v=JSON.parse(d.v);PS[d.k]=v;saveProf();render();break;}
    case 'ptest':Prof.start('Bonjour ! Je suis ton prof. Les mots *importants* s’affichent en gras dans les sous-titres. || Et parfois je te pose une question. Combien font deux plus deux ? [?3] | **Quatre**, bien sûr.','Test de la voix');break;
    case 'pkcopy':{const t=$('#pkmodel');const txt=t.value;const done=()=>toast('Modèle copié');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{t.hidden=false;t.select();toast('Sélectionne et copie le texte affiché');});}else{t.hidden=false;t.select();}break;}
    case 'pkpaste':importPack($('#pktxt').value);break;
    case 'pkdel':{const all=LS.get('packs',{});delete all[d.id];LS.set('packs',all);delete S.packs[d.id];S.catalogue=S.catalogue.filter(c=>c.id!==d.id);DBS.remove('packs/'+d.id);render();break;}
  }});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='pvoice'){PS.voice=el.value;saveProf();}
  if(el.id==='pkfile'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>importPack(String(r.result));r.readAsText(el.files[0]);}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('.inp input')&&S.session){S.session.vals[el.dataset.k]=el.value;if(S.session.err&&S.session.err[el.dataset.k]){delete S.session.err[el.dataset.k];const er=el.closest('.part-q').querySelector('.err');if(er)er.remove();}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.inp input')){e.preventDefault();const b=$('[data-act="acheck"],[data-act="mcheck"]');if(b)b.click();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Prof.playing&&!Prof.paused)Prof.pause();});

/* ================= Démarrage ================= */
async function boot(){paint('<p class="muted">Chargement…</p>');
  /* Matières intégrées dans ce fichier (blocs <script> plus bas) ; sinon catalogue de fichiers séparés */
  {try{const r=await fetch('matieres/catalogue.json',{cache:'no-cache'});const c=await r.json();c.forEach(x=>{if(!S.catalogue.find(y=>y.id===x.id))S.catalogue.push(x);});}catch(e){}}
  const imp=LS.get('packs',{});Object.values(imp).forEach(p=>{if(!S.packs[p.id])registerImported(p,false);});
  render();DBS.init();
  for(const c of S.catalogue.filter(c=>!c.importe&&!S.packs[c.id])){loadPack(c.id).then(()=>{if(S.route.v==='home')render();}).catch(()=>{});}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0);
</script>
